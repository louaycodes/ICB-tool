<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICB - Analyse des depenses consultants</title>
    <meta name="description" content="Application ICB Capgemini - Analyse des depenses et facturation des consultants intercompany.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <span class="header__title">ICB Analysis</span>
        <div class="header__separator"></div>
        <button class="btn btn--upload" id="btn-upload" onclick="document.getElementById('file-input').click()">
            Charger un fichier ICB
        </button>
        <button class="btn btn--export" id="btn-export" onclick="submitExport()" style="display:none;">
            Exporter (Excel)
        </button>
        <button class="btn btn--upload" id="btn-upload-forecast" onclick="document.getElementById('forecast-input').click()" style="display:none; background-color: var(--color-accent-light);">
            Importer Forecast
        </button>
        <input type="file" id="file-input" accept=".xlsx" onchange="uploadFile(this)">
        <input type="file" id="forecast-input" accept=".xlsx" onchange="uploadForecast(this)" style="display:none;">
        <div class="header__search" id="search-wrapper" style="display:none;">
            <svg class="header__search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" class="header__search-input" id="search-input" placeholder="Rechercher (nom, ID, projet...)" oninput="applySearch(this.value)">
        </div>
        <span class="header__status" id="status-text">Aucun fichier charge</span>
    </header>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-box">
            <div class="spinner"></div>
            <div>Chargement du fichier en cours...</div>
        </div>
    </div>

    <!-- Main -->
    <main class="main">
        <!-- Empty state (shown when no file is loaded) -->
        <div class="empty-state" id="empty-state">
            <div class="empty-state__icon">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            </div>
            <div class="empty-state__text">Aucun fichier ICB charge</div>
            <div class="empty-state__hint">Cliquez sur "Charger un fichier ICB" pour commencer l'analyse.</div>
        </div>

        <!-- Global Date Filter -->
        <div class="global-filters" id="global-filters" style="display:none;">
            <label>Du : <input type="date" id="global-start" onchange="applyGlobalDateFilter()"></label>
            <label>Au : <input type="date" id="global-end" onchange="applyGlobalDateFilter()"></label>
            <label style="margin-left: 20px;">
                Tolerance Ecart (Montant/NCR) : 
                <input type="number" step="0.1" id="gap-tolerance-input" value="2" style="width: 60px;" onchange="updateGapTolerance()">
            </label>
        </div>

        <!-- Month bar (always visible above the table) -->
        <div class="month-bar" id="month-bar">
            <span class="month-bar__label">Periode :</span>
        </div>

        <!-- Hierarchy table -->
        <div class="table-panel" id="table-panel" style="display:none;">
            <div class="table-scroll" id="table-scroll">
                <table class="h-table" id="main-table">
                    <thead>
                        <tr>
                            <th rowspan="2" style="min-width:280px" class="col-group-right">Projet</th>
                            <th rowspan="2" class="col-group-right">ID Consultant</th>
                            <th rowspan="2" class="col-group-right">Nom complet</th>
                            <th rowspan="2" class="col-group-right">Grade</th>
                            <th colspan="2" class="num col-group-right" style="text-align: center; border-bottom: 1px solid rgba(255,255,255,0.2);">NCR</th>
                            <th colspan="2" class="num col-group-right" style="text-align: center; border-bottom: 1px solid rgba(255,255,255,0.2);">Working Days</th>
                            <th colspan="2" class="num col-group-right" style="text-align: center; border-bottom: 1px solid rgba(255,255,255,0.2);">Cost</th>
                            <th rowspan="2" class="num">Raw Cost</th>
                        </tr>
                        <tr class="sub-header-row">
                            <th class="num sub-header col-sep">ICB</th>
                            <th class="num sub-header col-group-right">FORECAST</th>
                            <th class="num sub-header col-sep">ICB</th>
                            <th class="num sub-header col-group-right">FORECAST</th>
                            <th class="num sub-header col-sep">ICB</th>
                            <th class="num sub-header col-group-right">FORECAST</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>


    </main>

<script>
/* =====================================================================
   ICB App — Frontend JavaScript
   ===================================================================== */

// -- State --
let currentMonth = null;       // null = tous les mois
let availableMonths = [];
let selectedConsRow = null;     // row element currently selected
let globalStart = null;
let globalEnd = null;

// -- Utilities --
function fmt(n) {
    if (n == null || isNaN(n)) return "";
    return n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function monthLabel(mk) {
    // "2025-07" -> "Jul 25"
    const parts = mk.split("-");
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const m = parseInt(parts[1], 10) - 1;
    return months[m] + " " + parts[0].slice(2);
}

// -- Upload --
async function uploadFile(input) {
    const file = input.files[0];
    if (!file) return;

    document.getElementById("loading-overlay").classList.add("active");

    const formData = new FormData();
    formData.append("file", file);

    try {
        const resp = await fetch("/api/upload", { method: "POST", body: formData });
        const data = await resp.json();
        if (!resp.ok) {
            alert(data.error || "Erreur lors du chargement.");
            return;
        }

        // update status
        const status = document.getElementById("status-text");
        status.textContent = data.total_lines.toLocaleString() + " lignes lues — " +
                             data.filtered_lines.toLocaleString() + " apres filtrage";
        status.classList.add("header__status--loaded");

        availableMonths = data.available_months;
        currentMonth = null;

        buildMonthBar();
        await loadHierarchy();

        document.getElementById("empty-state").style.display = "none";
        document.getElementById("table-panel").style.display = "flex";
        document.getElementById("global-filters").style.display = "flex";
        document.getElementById("month-bar").classList.add("visible");
        document.getElementById("btn-export").style.display = "inline-block";
        
        // Cacher le bouton ICB car on ne permet pas de recharger par dessus
        document.getElementById("btn-upload").style.display = "none";
        
        // Afficher le bouton forecast apres avoir upload l'ICB
        document.getElementById("btn-upload-forecast").style.display = "inline-block";
        document.getElementById("search-wrapper").style.display = "flex";
        document.getElementById("search-input").value = "";
        
        document.getElementById("status-text").textContent = `Fichier actif: ${file.name} (${data.filtered_lines} lignes)`;
        document.getElementById("status-text").classList.add("header__status--loaded");
        closeAllInlineDetails();
    } catch (e) {
        alert("Erreur reseau : " + e.message);
    } finally {
        document.getElementById("loading-overlay").classList.remove("active");
        input.value = "";  // reset input so same file can be re-uploaded
    }
}

async function uploadForecast(input) {
    if (!input.files || input.files.length === 0) return;
    const file = input.files[0];
    const formData = new FormData();
    formData.append("file", file);

    const overlay = document.getElementById("loading-overlay");
    overlay.querySelector("div").textContent = "Chargement du Forecast en cours...";
    overlay.classList.add("active");

    try {
        const res = await fetch("/api/upload_forecast", {
            method: "POST",
            body: formData
        });
        const data = await res.json();
        if (!res.ok) {
            alert(data.error || "Erreur lors du chargement Forecast");
        } else {
            // Cache definitivement le bouton d'import forecast
            document.getElementById("btn-upload-forecast").style.display = "none";
            // Recharge la hierarchie pour afficher les nouvelles colonnes
            await loadHierarchy();
        }
    } catch (err) {
        alert("Erreur de connexion.");
    } finally {
        overlay.classList.remove("active");
        overlay.querySelector("div").textContent = "Chargement du fichier en cours...";
        input.value = "";
    }
}

// -- Month bar --
function buildMonthBar() {
    const bar = document.getElementById("month-bar");
    // remove old buttons (keep the label)
    while (bar.children.length > 1) {
        bar.removeChild(bar.lastChild);
    }

    // "Tous" button
    const allBtn = document.createElement("button");
    allBtn.className = "month-btn active";
    allBtn.textContent = "Tous";
    allBtn.onclick = () => selectMonth(null);
    allBtn.dataset.month = "all";
    bar.appendChild(allBtn);

    // individual months
    availableMonths.forEach(mk => {
        const btn = document.createElement("button");
        btn.className = "month-btn";
        btn.textContent = monthLabel(mk);
        btn.onclick = () => selectMonth(mk);
        btn.dataset.month = mk;
        bar.appendChild(btn);
    });
}

async function selectMonth(mk) {
    currentMonth = mk;

    // update button styles
    document.querySelectorAll(".month-btn").forEach(btn => {
        const isCurrent = (mk === null && btn.dataset.month === "all") ||
                          (btn.dataset.month === mk);
        btn.classList.toggle("active", isCurrent);
    });

    closeAllInlineDetails();
    await loadHierarchy();
}

// -- Load hierarchy data --
async function loadHierarchy() {
    let url = "/api/hierarchy?";
    if (currentMonth) url += `month=${currentMonth}&`;
    if (globalStart) url += `start_date=${globalStart}&`;
    if (globalEnd) url += `end_date=${globalEnd}&`;
    const resp = await fetch(url);
    const data = await resp.json();
    window.currentHierarchyData = data;
    renderHierarchy(data);
}

async function applyGlobalDateFilter() {
    globalStart = document.getElementById("global-start").value || null;
    globalEnd = document.getElementById("global-end").value || null;
    
    // fetch new available months
    let url = "/api/months?";
    if (globalStart) url += `start_date=${globalStart}&`;
    if (globalEnd) url += `end_date=${globalEnd}&`;
    
    const resp = await fetch(url);
    if (!resp.ok) return;
    availableMonths = await resp.json();
    
    if (currentMonth && !availableMonths.includes(currentMonth)) {
        currentMonth = null;
    }
    
    buildMonthBar();
    await loadHierarchy();
}

// -- Gap detection: compare ICB vs FORECAST values --
function getGapTolerance() {
    const val = document.getElementById("gap-tolerance-input").value;
    return parseFloat(val) || 0;
}

function updateGapTolerance() {
    if (window.currentHierarchyData) {
        renderHierarchy(window.currentHierarchyData);
    }
}

function hasGapAmount(icb, forecast) {
    if (icb == null || forecast == null || icb === "" || forecast === "") return false;
    return Math.abs(icb - forecast) > getGapTolerance();
}
function hasGapDays(icb, forecast) {
    if (icb == null || forecast == null || icb === "" || forecast === "") return false;
    return icb !== forecast;
}

// -- Render hierarchy table --
function renderHierarchy(ccProjects) {
    const tbody = document.getElementById("table-body");
    tbody.innerHTML = "";

    if (!ccProjects || ccProjects.length === 0) {
        const tr = document.createElement("tr");
        tr.innerHTML = '<td colspan="8" style="text-align:center;padding:32px;color:#718096;">Aucune donnee pour cette periode.</td>';
        tbody.appendChild(tr);
        return;
    }

    ccProjects.forEach(cc => {
        // Pre-compute gap flags for CC project totals
        const ccGapWd = hasGapDays(cc.totals.working_days, cc.totals.forecast_working_days);
        const ccGapBa = hasGapAmount(cc.totals.bill_amount, cc.totals.forecast_bill_amount);
        const ccGapNcr = hasGapAmount(cc.totals.ncr, cc.totals.forecast_ncr);

        // -- CC Project row (top-level) --
        const ccRow = document.createElement("tr");
        ccRow.className = "row-cc collapsed";
        ccRow.dataset.cc = cc.cc_project_number;
        const label = cc.project_name
            ? esc(cc.project_name) + ' — ' + esc(cc.cc_project_number)
            : esc(cc.cc_project_number);
        ccRow.innerHTML =
            '\x3ctd colspan="4"\x3e\x3cspan class="toggle-icon"\x3e&#9660;\x3c/span\x3e ' + label + '\x3c/td\x3e' +
            '\x3ctd class="num' + (ccGapNcr ? ' cell-gap' : '') + '"\x3e' + (cc.totals.ncr > 0 ? fmt(cc.totals.ncr) : '') + '\x3c/td\x3e' + // NCR ICB
            '\x3ctd class="num' + (ccGapNcr ? ' cell-gap' : '') + '" style="color:#7ee8e4; font-weight:600;"\x3e' + (cc.totals.forecast_working_days > 0 ? fmt(cc.totals.forecast_ncr) : '') + '\x3c/td\x3e' + // NCR FORECAST
            '\x3ctd class="num' + (ccGapWd ? ' cell-gap' : '') + '"\x3e' + fmt(cc.totals.working_days) + '\x3c/td\x3e' + // WD ICB
            '\x3ctd class="num' + (ccGapWd ? ' cell-gap' : '') + '" style="color:#7ee8e4; font-weight:600;"\x3e' + (cc.totals.forecast_working_days > 0 ? fmt(cc.totals.forecast_working_days) : '') + '\x3c/td\x3e' + // WD FORECAST
            '\x3ctd class="num' + (ccGapBa ? ' cell-gap' : '') + '"\x3e' + fmt(cc.totals.bill_amount) + '\x3c/td\x3e' + // BA ICB
            '\x3ctd class="num' + (ccGapBa ? ' cell-gap' : '') + '" style="color:#7ee8e4; font-weight:600;"\x3e' + (cc.totals.forecast_working_days > 0 ? fmt(cc.totals.forecast_bill_amount) : '') + '\x3c/td\x3e' + // BA FORECAST
            '\x3ctd class="num"\x3e' + fmt(cc.totals.raw_cost) + '\x3c/td\x3e';
        ccRow.onclick = () => toggleCC(cc.cc_project_number);
        tbody.appendChild(ccRow);

        // -- Consultant rows --
        cc.consultants.forEach((cons, idx) => {
            // Pre-compute gap flags per consultant
            const gapNcr = hasGapAmount(cons.ncr, cons.forecast_ncr);
            const gapWd = hasGapDays(cons.working_days, cons.forecast_working_days);
            const gapBa = hasGapAmount(cons.total_bill_amount, cons.forecast_bill_amount);

            const consRow = document.createElement("tr");
            let cls = "row-consultant";
            if (idx % 2 === 1) cls += " alt";
            if (cons.has_anomaly) cls += " anomaly";
            consRow.className = cls;
            consRow.style.display = "none";
            consRow.dataset.cc = cc.cc_project_number;
            consRow.dataset.emp = cons.employee_id;
            consRow.dataset.projectname = cc.project_name || "";
            consRow.innerHTML =
                '<td class="label-indent-1"></td>' +
                '<td>' + esc(cons.employee_id) + '</td>' +
                '<td>' + esc(cons.name) + '</td>' +
                '<td>' + esc(cons.grade) + '</td>' +
                '<td class="num' + (gapNcr ? ' cell-gap' : '') + '">' + fmt(cons.ncr) + '</td>' + // NCR ICB
                '<td class="num' + (gapNcr ? ' cell-gap' : '') + '" style="color:var(--color-accent); font-weight:600;">' + (cons.forecast_working_days > 0 ? fmt(cons.forecast_ncr) : '') + '</td>' + // NCR FORECAST
                '<td class="num' + (gapWd ? ' cell-gap' : '') + '">' + fmt(cons.working_days) + '</td>' + // WD ICB
                '<td class="num' + (gapWd ? ' cell-gap' : '') + '" style="color:var(--color-accent); font-weight:600;">' + (cons.forecast_working_days > 0 ? fmt(cons.forecast_working_days) : '') + '</td>' + // WD FORECAST
                '<td class="num' + (gapBa ? ' cell-gap' : '') + '">' + fmt(cons.total_bill_amount) + '</td>' + // BA ICB
                '<td class="num' + (gapBa ? ' cell-gap' : '') + '" style="color:var(--color-accent); font-weight:600;">' + (cons.forecast_working_days > 0 ? fmt(cons.forecast_bill_amount) : '') + '</td>' + // BA FORECAST
                '<td class="num">' + fmt(cons.total_raw_cost) + '</td>';
            consRow.dataset.consName = cons.name;
            consRow.onclick = (e) => { e.stopPropagation(); toggleDetail(consRow); };
            tbody.appendChild(consRow);
        });

        // -- Totals row --
        const totRow = document.createElement("tr");
        totRow.className = "row-totals";
        totRow.style.display = "none";
        totRow.dataset.cc = cc.cc_project_number;
        totRow.innerHTML =
            '<td class="label-indent-1"></td>' +
            '<td colspan="3">TOTAL ' + esc(cc.cc_project_number) + '</td>' +
            '<td class="num' + (ccGapNcr ? ' cell-gap' : '') + '">' + (cc.totals.ncr > 0 ? fmt(cc.totals.ncr) : '') + '</td>' + // NCR ICB
            '<td class="num' + (ccGapNcr ? ' cell-gap' : '') + '" style="color:var(--color-accent); font-weight:600;">' + (cc.totals.forecast_working_days > 0 ? fmt(cc.totals.forecast_ncr) : '') + '</td>' + // NCR FORECAST
            '<td class="num' + (ccGapWd ? ' cell-gap' : '') + '">' + fmt(cc.totals.working_days) + '</td>' + // WD ICB
            '<td class="num' + (ccGapWd ? ' cell-gap' : '') + '" style="color:var(--color-accent); font-weight:600;">' + (cc.totals.forecast_working_days > 0 ? fmt(cc.totals.forecast_working_days) : '') + '</td>' + // WD FORECAST
            '<td class="num' + (ccGapBa ? ' cell-gap' : '') + '">' + fmt(cc.totals.bill_amount) + '</td>' + // BA ICB
            '<td class="num' + (ccGapBa ? ' cell-gap' : '') + '" style="color:var(--color-accent); font-weight:600;">' + (cc.totals.forecast_working_days > 0 ? fmt(cc.totals.forecast_bill_amount) : '') + '</td>' + // BA FORECAST
            '<td class="num">' + fmt(cc.totals.raw_cost) + '</td>';
        tbody.appendChild(totRow);
    });
}

// -- Toggle expand/collapse --
function toggleCC(ccNumber) {
    const rows = document.querySelectorAll('#table-body tr');
    const ccRow = document.querySelector('.row-cc[data-cc="' + ccNumber + '"]');
    const isCollapsed = ccRow.classList.toggle("collapsed");

    rows.forEach(row => {
        if (row === ccRow) return;
        if (row.dataset.cc === ccNumber && !row.classList.contains("row-cc")) {
            row.style.display = isCollapsed ? "none" : "";
        }
    });
}

async function fetchTransactions(empId, ccProj) {
    let url = `/api/transactions?employee=${encodeURIComponent(empId)}&cc_project=${encodeURIComponent(ccProj)}`;
    if (currentMonth) url += `&month=${currentMonth}`;
    if (globalStart) url += `&start_date=${globalStart}`;
    if (globalEnd) url += `&end_date=${globalEnd}`;
    
    const resp = await fetch(url);
    return await resp.json();
}

// -- Inline detail (toggle under the consultant row) --
async function toggleDetail(rowEl) {
    const empId = rowEl.dataset.emp;
    const ccProject = rowEl.dataset.cc;
    const name = rowEl.dataset.consName || "";

    // if detail row already exists right after, remove it (toggle off)
    const nextRow = rowEl.nextElementSibling;
    if (nextRow && nextRow.classList.contains("row-detail-inline")) {
        nextRow.remove();
        rowEl.classList.remove("selected");
        selectedConsRow = null;
        return;
    }

    // close any other open detail
    closeAllInlineDetails();

    // highlight this row
    rowEl.classList.add("selected");
    selectedConsRow = rowEl;

    // fetch transactions
    const txns = await fetchTransactions(empId, ccProject);

    // build the inline detail row
    const detailRow = document.createElement("tr");
    detailRow.className = "row-detail-inline";
    detailRow.dataset.cc = ccProject;
    const td = document.createElement("td");
    td.setAttribute("colspan", "11");

    let html = '<div class="inline-detail">';
    html += '<div class="inline-detail__header">';
    html += '<span>Transactions de ' + esc(name) + ' (' + esc(empId) + ') sur ' + esc(ccProject) + '</span>';
    html += '</div>';
    html += '<table class="detail-table"><thead><tr>';
    html += '<th>ID Transaction</th><th>Date</th><th>Type depense</th><th>Facture</th>';
    html += '<th class="num">Working Days</th><th class="num">NCR</th>';
    html += '<th class="num">Raw Cost</th><th class="num">Cost</th>';
    html += '</tr></thead><tbody>';
    txns.forEach((t, i) => {
        let rowClass = (i % 2 === 0 ? 'even' : 'odd');
        if (t.has_anomaly) {
            rowClass += ' anomaly';
        }
        html += '<tr class="' + rowClass + '">';
        html += '<td>' + esc(t.item_id) + '</td>';
        html += '<td>' + esc(t.date) + '</td>';
        html += '<td>' + esc(t.expenditure_type) + '</td>';
        html += '<td>' + esc(t.invoice_type) + '</td>';
        html += '<td class="num">' + fmt(t.working_days) + '</td>';
        html += '<td class="num">' + fmt(t.ncr) + '</td>';
        html += '<td class="num">' + fmt(t.raw_cost) + '</td>';
        html += '<td class="num">' + fmt(t.bill_amount) + '</td>';        html += '</tr>';
    });
    html += '</tbody></table></div>';
    td.innerHTML = html;
    detailRow.appendChild(td);

    // insert right after the consultant row
    rowEl.parentNode.insertBefore(detailRow, rowEl.nextSibling);
}

function closeAllInlineDetails() {
    document.querySelectorAll('.row-detail-inline').forEach(r => r.remove());
    if (selectedConsRow) {
        selectedConsRow.classList.remove("selected");
        selectedConsRow = null;
    }
}

// -- Search --
function applySearch(query) {
    const q = query.trim().toLowerCase();
    const rows = document.querySelectorAll('#table-body tr');

    if (!q) {
        // restore visibility based on the collapsed state
        rows.forEach(row => {
            if (row.classList.contains("row-cc")) {
                row.style.display = "";
            } else if (row.dataset.cc) {
                const ccRow = document.querySelector(`.row-cc[data-cc="${row.dataset.cc}"]`);
                if (ccRow && ccRow.classList.contains("collapsed")) {
                    row.style.display = "none";
                } else {
                    row.style.display = "";
                }
            }
        });
        return;
    }

    // track which cc projects match the query (either directly or via their consultants)
    const visibleCCs = new Set();

    rows.forEach(row => {
        if (row.classList.contains("row-consultant")) {
            const text = row.textContent.toLowerCase();
            const cc = (row.dataset.cc || "").toLowerCase();
            const projectName = (row.dataset.projectname || "").toLowerCase();
            if (text.includes(q) || cc.includes(q) || projectName.includes(q)) {
                visibleCCs.add(row.dataset.cc);
            }
        } else if (row.classList.contains("row-cc")) {
            const ccText = row.textContent.toLowerCase();
            if (ccText.includes(q)) {
                visibleCCs.add(row.dataset.cc);
            }
        }
    });

    // Update display based on matched CCs AND their collapsed state
    rows.forEach(row => {
        if (row.classList.contains("row-cc")) {
            // Show the CC row only if it matches
            row.style.display = visibleCCs.has(row.dataset.cc) ? "" : "none";
        } else if (row.dataset.cc) {
            // For consultants, totals, and inline details
            if (!visibleCCs.has(row.dataset.cc)) {
                row.style.display = "none";
            } else {
                // The project matches. We only show the child rows if the project is NOT collapsed.
                const ccRow = document.querySelector(`.row-cc[data-cc="${row.dataset.cc}"]`);
                if (ccRow && ccRow.classList.contains("collapsed")) {
                    row.style.display = "none";
                } else {
                    // It's expanded and matches, so show it
                    row.style.display = "";
                }
            }
        }
    });
}
// -- Escape HTML --
function esc(val) {
    if (val == null) return "";
    const d = document.createElement("div");
    d.textContent = String(val);
    return d.innerHTML;
}

// -- Export --
function submitExport() {
    let url = "/api/export?";
    if (currentMonth) url += `month=${currentMonth}&`;
    if (globalStart) url += `start_date=${globalStart}&`;
    if (globalEnd) url += `end_date=${globalEnd}&`;
    
    const gapTol = document.getElementById("gap-tolerance-input").value;
    if (gapTol) url += `gap_tolerance=${gapTol}&`;
    
    fetch(url)
        .then(res => res.json())
        .then(data => {
            if (data.error) {
                alert("Erreur lors de l'exportation : " + data.error);
            } else {
                alert(`${data.message}\nChemin : ${data.path}`);
            }
        })
        .catch(err => {
            alert("Erreur réseau : " + err);
        });
}
